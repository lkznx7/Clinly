openapi: 3.1.0
info:
  title: Clinly API — Especificação Consolidada
  description: |
    API completa do sistema de gestão clínica Clinly.

    Esta especificação OpenAPI 3.1 reúne todos os endpoints de todos os microserviços
    em um único arquivo consolidado.

    ## Arquitetura

    O sistema é composto por 8 microserviços:
    - **auth-service**: Autenticação e registro
    - **patient-service**: CRUD de pacientes
    - **appointment-service**: CRUD de agendamentos
    - **staff-service**: CRUD da equipe
    - **professional-service**: Listagem de profissionais (dropdown)
    - **dashboard-service**: KPIs e gráficos do dashboard
    - **report-service**: Relatórios e analytics
    - **notification-service**: Notificações do sistema

    ## Autenticação

    Todos os endpoints (exceto /auth/*) exigem JWT Bearer Token.
    O token é obtido via POST /auth/login ou POST /auth/register.

    ## Documentação por Serviço

    Cada microserviço possui sua própria documentação em:
    - `./auth/auth/docs/`
    - `./pacientes/docs/`
    - `./consultas/docs/`
    - `./equipe/docs/`
    - `./profissionais/docs/`
    - `./dashboard/Dashboard/docs/`
    - `./relatorios/docs/`
    - `./rabbit/docs/`
    - `./gateway/gateway/docs/`

  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local (via Gateway)
  - url: https://api.clinly.com.br
    description: Produção

paths:
  # ──────────────────────────────────────────────
  # AUTH SERVICE
  # ──────────────────────────────────────────────
  /auth/register:
    $ref: "./auth/auth/docs/openapi.yaml#/paths/~1auth~1register"

  /auth/login:
    $ref: "./auth/auth/docs/openapi.yaml#/paths/~1auth~1login"

  # ──────────────────────────────────────────────
  # PATIENT SERVICE
  # ──────────────────────────────────────────────
  /patients:
    $ref: "./pacientes/docs/openapi.yaml#/paths/~1patients"

  /patients/{id}:
    $ref: "./pacientes/docs/openapi.yaml#/paths/~1patients~1{id}"

  # ──────────────────────────────────────────────
  # APPOINTMENT SERVICE
  # ──────────────────────────────────────────────
  /appointments:
    $ref: "./consultas/docs/openapi.yaml#/paths/~1appointments"

  /appointments/{id}:
    $ref: "./consultas/docs/openapi.yaml#/paths/~1appointments~1{id}"

  # ──────────────────────────────────────────────
  # STAFF SERVICE
  # ──────────────────────────────────────────────
  /staff:
    $ref: "./equipe/docs/openapi.yaml#/paths/~1staff"

  /staff/{id}:
    $ref: "./equipe/docs/openapi.yaml#/paths/~1staff~1{id}"

  # ──────────────────────────────────────────────
  # PROFESSIONAL SERVICE
  # ──────────────────────────────────────────────
  /professionals:
    $ref: "./profissionais/docs/openapi.yaml#/paths/~1professionals"

  # ──────────────────────────────────────────────
  # DASHBOARD SERVICE
  # ──────────────────────────────────────────────
  /dashboard/summary:
    $ref: "./dashboard/Dashboard/docs/openapi.yaml#/paths/~1dashboard~1summary"

  /dashboard/charts:
    $ref: "./dashboard/Dashboard/docs/openapi.yaml#/paths/~1dashboard~1charts"

  /dashboard/activities:
    $ref: "./dashboard/Dashboard/docs/openapi.yaml#/paths/~1dashboard~1activities"

  # ──────────────────────────────────────────────
  # REPORT SERVICE
  # ──────────────────────────────────────────────
  /reports/summary:
    $ref: "./relatorios/docs/openapi.yaml#/paths/~1reports~1summary"

  /reports/charts:
    $ref: "./relatorios/docs/openapi.yaml#/paths/~1reports~1charts"

  # ──────────────────────────────────────────────
  # NOTIFICATION SERVICE
  # ──────────────────────────────────────────────
  /notifications:
    $ref: "./rabbit/docs/openapi.yaml#/paths/~1notifications"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtido via POST /auth/login. Enviar no header `Authorization: Bearer <token>`.
