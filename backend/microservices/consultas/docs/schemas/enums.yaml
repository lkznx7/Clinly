AppointmentStatus:
  description: Status atual da consulta
  type: string
  enum:
    - SCHEDULED
    - CONFIRMED
    - IN_PROGRESS
    - COMPLETED
    - CANCELLED
    - NO_SHOW
  values:
    SCHEDULED: Consulta agendada, aguardando confirmação
    CONFIRMED: Consulta confirmada pelo paciente/profissional
    IN_PROGRESS: Consulta em andamento
    COMPLETED: Consulta realizada com sucesso
    CANCELLED: Consulta cancelada
    NO_SHOW: Paciente não compareceu

AppointmentType:
  description: Tipo da consulta
  type: string
  enum:
    - CONSULTATION
    - FOLLOW_UP
    - EXAM
    - PROCEDURE
    - TELEMEDICINE
  values:
    CONSULTATION: Consulta regular
    FOLLOW_UP: Retorno / acompanhamento
    EXAM: Realização de exame
    PROCEDURE: Procedimento clínico
    TELEMEDICINE: Atendimento remoto
