openapi: 3.1.0
info:
  title: Staff Service API
  description: Microservice for managing clinic staff members.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/staff
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StaffRole:
      type: string
      enum: [DOCTOR, NURSE, RECEPTIONIST, ADMIN]

    StaffStatus:
      type: string
      enum: [ACTIVE, INACTIVE, ON_LEAVE]

    CreateStaffRequest:
      type: object
      required: [name, email, phone, role]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          minLength: 8
          maxLength: 20
        role:
          $ref: '#/components/schemas/StaffRole'
        specialty:
          type: string
          maxLength: 100
        crm:
          type: string
          maxLength: 20

    UpdateStaffRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          minLength: 8
          maxLength: 20
        role:
          $ref: '#/components/schemas/StaffRole'
        specialty:
          type: string
          maxLength: 100
        crm:
          type: string
          maxLength: 20

    StaffResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/StaffRole'
        specialty:
          type: string
          nullable: true
        crm:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/StaffStatus'
        avatarUrl:
          type: string
          format: uri
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PageStaffResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/StaffResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
        last:
          type: boolean
        first:
          type: boolean
        numberOfElements:
          type: integer
        empty:
          type: boolean
        sort:
          type: object
          properties:
            sorted:
              type: boolean
            unsorted:
              type: boolean
            empty:
              type: boolean

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
        timestamp:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  /staff:
    get:
      summary: List all staff members with pagination
      tags: [Staff]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/StaffRole'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/StaffStatus'
        - name: sort
          in: query
          schema:
            type: string
            example: name,asc
      responses:
        '200':
          description: Paginated list of staff members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageStaffResponse'
        '401':
          description: Unauthorized

    post:
      summary: Create a new staff member
      tags: [Staff]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Staff member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '409':
          description: Conflict (duplicate email or crm)

  /staff/{id}:
    get:
      summary: Get a staff member by ID
      tags: [Staff]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Staff member details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '401':
          description: Unauthorized
        '404':
          description: Staff member not found

    put:
      summary: Update a staff member
      tags: [Staff]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRequest'
      responses:
        '200':
          description: Staff member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '404':
          description: Staff member not found

    delete:
      summary: Delete a staff member
      tags: [Staff]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Staff member deleted
        '401':
          description: Unauthorized
        '404':
          description: Staff member not found
