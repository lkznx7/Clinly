openapi: 3.0.3
info:
  title: Dashboard Service API
  description: Read-only service providing aggregated dashboard data for the Clinly platform. Consumes events from RabbitMQ to update materialized views.
  version: 1.0.0

servers:
  - url: /api/dashboard
    description: Gateway-prefixed base path

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DashboardSummary:
      type: object
      properties:
        appointmentsToday:
          type: integer
          description: Number of appointments scheduled for today
        activePatients:
          type: integer
          description: Total active patients in the system
        newPatientsThisMonth:
          type: integer
          description: Patients registered in the current month
        revenueThisMonth:
          type: number
          format: double
          description: Total revenue for the current month

    DashboardChartData:
      type: object
      properties:
        revenueByMonth:
          type: array
          items:
            $ref: '#/components/schemas/RevenueByMonth'
        appointmentsByType:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentsByType'
        appointmentsByStatus:
          type: array
          items:
            $ref: '#/components/schemas/AppointmentsByStatus'

    RevenueByMonth:
      type: object
      properties:
        month:
          type: string
          description: Month abbreviation (e.g. Jan, Fev, Mar)
        revenue:
          type: number
          format: double

    AppointmentsByType:
      type: object
      properties:
        type:
          type: string
          enum: [CONSULTATION, FOLLOW_UP, EXAM, PROCEDURE]
        count:
          type: integer

    AppointmentsByStatus:
      type: object
      properties:
        status:
          type: string
          enum: [SCHEDULED, CONFIRMED, COMPLETED, CANCELLED]
        count:
          type: integer

    RecentActivity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/ActivityType'
        description:
          type: string
        timestamp:
          type: string
          format: date-time

    ActivityType:
      type: string
      enum:
        - PATIENT_CREATED
        - PATIENT_UPDATED
        - APPOINTMENT_CREATED
        - APPOINTMENT_COMPLETED
        - APPOINTMENT_CANCELLED
        - STAFF_ADDED

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string

paths:
  /summary:
    get:
      tags:
        - Dashboard
      summary: Get dashboard summary data
      description: Returns aggregated counts for appointments, patients, and revenue.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard summary data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
        '401':
          description: Unauthorized - invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /charts:
    get:
      tags:
        - Dashboard
      summary: Get dashboard chart data
      description: Returns revenue, appointment type, and appointment status data for charts.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard chart data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardChartData'
        '401':
          description: Unauthorized - invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /activities:
    get:
      tags:
        - Dashboard
      summary: Get recent activity feed
      description: Returns a list of recent activities for the dashboard feed.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of recent activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentActivity'
        '401':
          description: Unauthorized - invalid or missing JWT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
