openapi: 3.1.0
info:
  title: Clinly Patient Service
  description: |
    Microserviço de pacientes do sistema Clinly.

    Endpoints CRUD completos para gerenciamento de pacientes com paginação,
    busca textual, filtro por status e ordenação.
  version: "1.0.0"
servers:
  - url: http://localhost:8080
    description: Desenvolvimento local
  - url: https://api.clinly.com.br
    description: Produção

paths:
  /patients:
    get:
      tags:
        - Pacientes
      summary: Listar pacientes
      description: Retorna lista paginada de pacientes com suporte a busca, filtro por status e ordenação.
      operationId: getPatients
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Número da página (zero-based)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: Quantidade de itens por página
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: search
          in: query
          description: Termo de busca (busca por nome, email ou CPF)
          schema:
            type: string
        - name: status
          in: query
          description: Filtrar por status do paciente
          schema:
            $ref: "#/components/schemas/PatientStatus"
        - name: sort
          in: query
          description: "Ordenação no formato `campo,direcao`. Ex: `name,asc`, `createdAt,desc`"
          schema:
            type: string
            example: "name,asc"
      responses:
        "200":
          description: Lista paginada de pacientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagePatientResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      tags:
        - Pacientes
      summary: Criar paciente
      description: Cria um novo paciente no sistema.
      operationId: createPatient
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientRequest"
      responses:
        "201":
          description: Paciente criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /patients/{id}:
    get:
      tags:
        - Pacientes
      summary: Buscar paciente por ID
      description: Retorna os dados de um paciente específico.
      operationId: getPatient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID do paciente
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Dados do paciente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Pacientes
      summary: Atualizar paciente
      description: Atualiza os dados de um paciente existente.
      operationId: updatePatient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID do paciente
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientRequest"
      responses:
        "200":
          description: Paciente atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Pacientes
      summary: Excluir paciente
      description: Remove um paciente do sistema.
      operationId: deletePatient
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID do paciente
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Paciente excluído com sucesso (sem conteúdo)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtido via POST /auth/login ou POST /auth/register.

  schemas:
    PatientStatus:
      description: Status do paciente no sistema
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - ARCHIVED

    Gender:
      description: Gênero do paciente
      type: string
      enum:
        - MALE
        - FEMALE
        - OTHER

    CreatePatientRequest:
      description: Dados para criação de um novo paciente
      type: object
      required:
        - name
        - email
        - phone
        - cpf
        - birthDate
        - gender
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          description: Nome completo do paciente
        email:
          type: string
          format: email
          maxLength: 255
          description: Email do paciente (deve ser único no sistema)
        phone:
          type: string
          minLength: 8
          maxLength: 20
          description: Número de telefone do paciente
        cpf:
          type: string
          minLength: 11
          maxLength: 14
          description: CPF do paciente (deve ser único no sistema). Formatos aceitos: `12345678900` ou `123.456.789-00`
        birthDate:
          type: string
          format: date
          description: Data de nascimento (YYYY-MM-DD)
        gender:
          $ref: "#/components/schemas/Gender"
        address:
          type: string
          maxLength: 500
          description: Endereço completo do paciente

    UpdatePatientRequest:
      description: Dados para atualização de paciente. O frontend sempre envia todos os campos.
      type: object
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 120
          description: Nome completo do paciente
        email:
          type: string
          format: email
          maxLength: 255
          description: Email do paciente (deve ser único)
        phone:
          type: string
          minLength: 8
          maxLength: 20
          description: Número de telefone
        cpf:
          type: string
          minLength: 11
          maxLength: 14
          description: CPF do paciente (deve ser único)
        birthDate:
          type: string
          format: date
          description: Data de nascimento (YYYY-MM-DD)
        gender:
          $ref: "#/components/schemas/Gender"
        address:
          type: string
          maxLength: 500
          description: Endereço completo

    PatientResponse:
      type: object
      required:
        - id
        - name
        - email
        - phone
        - cpf
        - birthDate
        - gender
        - address
        - status
        - lastAppointment
        - nextAppointment
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: UUID do paciente
        name:
          type: string
          description: Nome completo do paciente
        email:
          type: string
          format: email
          description: Email do paciente
        phone:
          type: string
          description: Telefone do paciente
        cpf:
          type: string
          description: CPF do paciente
        birthDate:
          type: string
          format: date
          description: Data de nascimento (YYYY-MM-DD)
        gender:
          $ref: "#/components/schemas/Gender"
        address:
          type: string
          description: Endereço completo
        status:
          $ref: "#/components/schemas/PatientStatus"
        lastAppointment:
          type: string
          format: date
          nullable: true
          description: Data da última consulta (YYYY-MM-DD) ou null se nunca consultou
        nextAppointment:
          type: string
          format: date
          nullable: true
          description: Data da próxima consulta agendada (YYYY-MM-DD) ou null
        createdAt:
          type: string
          format: date-time
          description: Data/hora de criação (ISO 8601)
        updatedAt:
          type: string
          format: date-time
          description: Data/hora da última atualização (ISO 8601)

    PagePatientResponse:
      type: object
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
        - last
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PatientResponse"
        page:
          type: integer
          description: Número da página atual (zero-based)
        size:
          type: integer
          description: Quantidade de itens por página
        totalElements:
          type: integer
          description: Total de elementos no banco
        totalPages:
          type: integer
          description: Total de páginas
        last:
          type: boolean
          description: Indica se é a última página
        first:
          type: boolean
          description: Indica se é a primeira página
        numberOfElements:
          type: integer
          description: Quantidade de elementos na página atual
        empty:
          type: boolean
          description: Indica se a página está vazia
        sort:
          type: object
          properties:
            sorted:
              type: boolean
            unsorted:
              type: boolean
            empty:
              type: boolean

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: Código HTTP do erro
        error:
          type: string
          description: Categoria do erro
        message:
          type: string
          description: Mensagem descritiva do erro
        timestamp:
          type: string
          format: date-time
          description: Timestamp do erro (ISO 8601)
        path:
          type: string
          description: Caminho da requisição que gerou o erro
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                description: Campo que gerou o erro de validação
              message:
                type: string
                description: Mensagem de erro do campo
          description: Lista de erros de validação (presente apenas em erros 400)

  responses:
    BadRequest:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Não autenticado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflito (email ou CPF já cadastrado)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
