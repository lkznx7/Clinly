# =============================================================================
# PATIENT SCHEMAS — Clinly API
# =============================================================================

CreatePatientRequest:
  description: Dados para criação de um novo paciente
  type: object
  required:
    - name
    - email
    - phone
    - cpf
    - birthDate
    - gender
  properties:
    name:
      type: string
      minLength: 3
      maxLength: 120
      description: Nome completo do paciente
    email:
      type: string
      format: email
      maxLength: 255
      description: Email do paciente (deve ser único)
    phone:
      type: string
      minLength: 8
      maxLength: 20
      description: Número de telefone
    cpf:
      type: string
      minLength: 11
      maxLength: 14
      description: "CPF do paciente (deve ser único). Formatos aceitos: 12345678900 ou 123.456.789-00"
    birthDate:
      type: string
      format: date
      description: Data de nascimento (YYYY-MM-DD)
    gender:
      $ref: "./enums.yaml#/Gender"
    address:
      type: string
      maxLength: 500
      description: Endereço completo

UpdatePatientRequest:
  description: Dados para atualização de paciente (PUT). O frontend sempre envia todos os campos.
  type: object
  properties:
    name:
      type: string
      minLength: 3
      maxLength: 120
    email:
      type: string
      format: email
      maxLength: 255
    phone:
      type: string
      minLength: 8
      maxLength: 20
    cpf:
      type: string
      minLength: 11
      maxLength: 14
    birthDate:
      type: string
      format: date
    gender:
      $ref: "./enums.yaml#/Gender"
    address:
      type: string
      maxLength: 500
