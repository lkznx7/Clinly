services:
  postgres:
    image: postgres:16-alpine
    container_name: clinly_auth_db
    environment:
      POSTGRES_DB: clinly_auth
      POSTGRES_USER: clinly
      POSTGRES_PASSWORD: clinly
    ports:
      - "5432:5432"
    volumes:
      - auth_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinly -d clinly_auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinly_auth_service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: clinly_auth
      DB_USER: clinly
      DB_PASSWORD: clinly
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  auth_db_data:
